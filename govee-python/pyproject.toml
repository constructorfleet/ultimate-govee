[project]
name = "govee-ultimate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = []

[tool.pytest.ini_options]
minversion = "7.0"
# For this focused iteration we'll relax the global coverage requirement and
# only measure coverage for the IoT channel package to allow iterating on the
# IoT channel implementation and tests. Later we will restore the full
# project's coverage gate.
addopts = "--cov=govee.domain.channels.iot --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = [".venv", "dist", "build", "node_modules"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

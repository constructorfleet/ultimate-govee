[scripts]
# Lightweight scripts for working with the translated Python package.
# These are intentionally minimal so tests can be run in environments without
# uv installed or where installing dependencies is not possible. The
# project-specific scripts in govee-python/uv.scripts.toml remain the
# canonical place for the full workflow used during development.

# Run the lightweight test runner in the packaged virtualenv if present.
test = "govee-python/.venv/bin/python govee-python/run_tests.py"

# Run ruff lint over the Python translation.
lint = "govee-python/.venv/bin/ruff check govee-python/src govee-python/tests || true"

# Check formatting tools in the venv and run them in check-only mode when
# available. Fall back to a helpful message if the tools aren't present.
format_check = "sh -c '\nif [ -x govee-python/.venv/bin/black ] && [ -x govee-python/.venv/bin/isort ] && [ -x govee-python/.venv/bin/ruff ]; then\n  govee-python/.venv/bin/black --check govee-python && \\\n  govee-python/.venv/bin/isort --check-only govee-python && \\\n  govee-python/.venv/bin/ruff check govee-python/src govee-python/tests;\nelse\n  echo "format/lint tools not available in govee-python/.venv; skipping format_check";\nfi\n'"

# Run the project's all_checks helper which runs format_check + tests.
all_checks = "python tools/all_checks.py"

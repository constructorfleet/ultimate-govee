[scripts]
# Lightweight scripts for working with the translated Python package.
# These are intentionally minimal so tests can be run in environments without
# uv installed or where installing dependencies is not possible. The
# project-specific scripts in govee-python/uv.scripts.toml remain the
# canonical place for the full workflow used during development.

test = "govee-python/.venv/bin/python govee-python/run_tests.py"
lint = "govee-python/.venv/bin/ruff check govee-python/src govee-python/tests || true"
format_check = "sh -c '
if [ -x govee-python/.venv/bin/black ] && [ -x govee-python/.venv/bin/isort ] && [ -x govee-python/.venv/bin/ruff ]; then\n  govee-python/.venv/bin/black --check govee-python && \\n  govee-python/.venv/bin/isort --check-only govee-python && \\n  govee-python/.venv/bin/ruff check govee-python/src govee-python/tests;\nelse\n  echo "format/lint tools not available in govee-python/.venv; skipping format_check";\nfi\n'"
all_checks = "python tools/all_checks.py"
  XDG_CACHE_HOME=$(pwd)/.uv_cache govee-python/.venv/bin/black --check govee-python && \
  XDG_CACHE_HOME=$(pwd)/.uv_cache govee-python/.venv/bin/isort --check-only govee-python && \
  XDG_CACHE_HOME=$(pwd)/.uv_cache govee-python/.venv/bin/ruff check govee-python/src govee-python/tests; \
else \
  echo "format/lint tools not available in govee-python/.venv; skipping format_check"; \
fi && govee-python/.venv/bin/python govee-python/run_tests.py'"